<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta name="apple-mobile-web-app-title" content="HTV HR">
  <meta name="theme-color" content="#F6EFE3">

  <title>HTV HR</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://lh3.googleusercontent.com/d/1XXbdoGTqfp6bRR_baYsr0GvQ8uRei4d_"
  >

  <link
    rel="icon"
    type="image/png"
    href="https://lh3.googleusercontent.com/d/1NmEtOM0IPmywMgJoaFKmSWCzNIWRTtJF"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;
      overscroll-behavior: none;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      font-family:
        'Segoe UI',
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

      color-scheme: light;
    }

    body {
      position: fixed;
      inset: 0;

      width: 100vw;

      height: 100vh;
      height: 100svh;
      height: 100dvh;

      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      -webkit-text-size-adjust: 100%;
    }


    /* =====================================================
       APP IFRAME
       ===================================================== */

    #app {
      position: fixed;
      inset: 0;

      display: block;

      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;

      min-width: 100%;
      min-height: 100%;

      border: 0;
      outline: 0;

      background: #F4F6F9;

      opacity: 0;

      transition: opacity .18s ease;

      z-index: 1;
    }

    #app.daTai {
      opacity: 1;
    }


    /* =====================================================
       MÀN HÌNH CHỜ
       ===================================================== */

    #tai {
      position: fixed;
      inset: 0;

      z-index: 9999;

      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding-top:
        max(20px, env(safe-area-inset-top, 0px));

      padding-right:
        max(20px, env(safe-area-inset-right, 0px));

      padding-bottom:
        max(20px, env(safe-area-inset-bottom, 0px));

      padding-left:
        max(20px, env(safe-area-inset-left, 0px));

      overflow: hidden;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity .22s ease,
        visibility .22s ease;
    }

    #tai.anTai {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* =====================================================
       LOGO
       ===================================================== */

    #tai .logoTai {
      width: 104px;
      height: 104px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 22px;
    }

    #tai .logoTai img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =====================================================
       LOADING SPINNER
       ===================================================== */

    #tai .vong {
      width: 38px;
      height: 38px;

      border: 3px solid rgba(31,78,121,.16);
      border-top-color: #1F4E79;

      border-radius: 50%;

      animation: quay .8s linear infinite;
    }

    @keyframes quay {
      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       CHỮ LOADING
       ===================================================== */

    #tai p {
      margin-top: 15px;

      font-size: 13px;
      font-weight: 500;

      color: #7F8C8D;

      text-align: center;
      line-height: 1.5;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      #tai .logoTai {
        width: 90px;
        height: 90px;
        margin-bottom: 19px;
      }

      #tai .vong {
        width: 34px;
        height: 34px;
      }

      #tai p {
        font-size: 12.5px;
        margin-top: 13px;
      }
    }


    /* =====================================================
       IPHONE / ANDROID MÀN NHỎ
       ===================================================== */

    @media (max-width: 390px) {

      #tai .logoTai {
        width: 82px;
        height: 82px;
      }

      #tai p {
        font-size: 12px;
      }
    }


    /* =====================================================
       PWA / ADD TO HOME SCREEN
       ===================================================== */

    @media (display-mode: standalone) {

      body,
      #app,
      #tai {
        height: 100dvh;
      }
    }
  </style>
</head>


<body>

  <!-- ================= MÀN HÌNH CHỜ ================= -->
  <div id="tai">

    <div class="logoTai">
      <img
        src="https://lh3.googleusercontent.com/d/1IU0gpNl0tcK-9drj2r2FkL2QfykBtjZd"
        alt="HTV EDU Group"
        referrerpolicy="no-referrer"
      >
    </div>

    <div class="vong"></div>

    <p>
      Đang mở Cổng Thông tin Nhân sự...
    </p>

  </div>


  <!-- ================= ỨNG DỤNG HRM ================= -->
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbwT6PZZ1WDmBrAE6g3vfKuQAkbnL7oVuXJfuw2hc-rDLId1L4ONZzfzXduaYDLYZoXI3Q/exec"
  allow="clipboard-write; geolocation"
  title="Cổng Thông tin Nhân sự HTV"
></iframe>


<script>
  (function () {

    var app = document.getElementById('app');
    var tai = document.getElementById('tai');

    var daMoApp = false;


    function hienApp() {

      if (daMoApp) return;

      daMoApp = true;

      // Iframe đã reset xong giao diện thì mới cho hiện
      app.classList.add('daTai');

      requestAnimationFrame(function () {

        requestAnimationFrame(function () {

          setTimeout(function () {
            tai.classList.add('anTai');
          }, 100);

        });

      });
    }


    /*
     * Không dùng iframe.onload để ẩn loading nữa.
     * onload có thể xảy ra trước khi Apps Script reset DOM cũ.
     *
     * Chỉ khi Apps Script gửi HTV_HRM_READY
     * thì mới mở giao diện.
     */
    window.addEventListener('message', function (event) {

      if (event.source !== app.contentWindow) {
        return;
      }

      if (
        event.data &&
        event.data.type === 'HTV_HRM_READY'
      ) {
        hienApp();
      }

    });


    /*
     * Fallback phòng trường hợp postMessage không tới được
     * trên một WebView đặc biệt.
     */
    setTimeout(function () {
      hienApp();
    }, 12000);

  })();
</script>

</body>
</html>
