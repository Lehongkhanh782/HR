<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTV HR">
  <meta name="theme-color" content="#EDE0CC">

  <title>HTV HR</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://lh3.googleusercontent.com/d/1XXbdoGTqfp6bRR_baYsr0GvQ8uRei4d_"
  >

  <link
    rel="icon"
    type="image/png"
    href="https://lh3.googleusercontent.com/d/1NmEtOM0IPmywMgJoaFKmSWCzNIWRTtJF"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      background: #EDE0CC;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;

      font-family:
        'Segoe UI',
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      -webkit-text-size-adjust: 100%;
    }

    /*
     * QUAN TRỌNG:
     * Không đặt height:100vh / 100svh / 100dvh ở đây.
     * inset:0 sẽ tự phủ kín viewport thật, kể cả safe-area iPhone.
     */
    #khungApp {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );
    }

    #app {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      display: block;

      width: 100%;
      height: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      opacity: 0;

      transition: opacity .18s ease;
    }

    #app.daTai {
      opacity: 1;
    }

    #tai {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      z-index: 999999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding-top:
        max(20px, env(safe-area-inset-top, 0px));

      padding-right:
        max(20px, env(safe-area-inset-right, 0px));

      padding-bottom:
        max(20px, env(safe-area-inset-bottom, 0px));

      padding-left:
        max(20px, env(safe-area-inset-left, 0px));

      overflow: hidden;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity .22s ease,
        visibility .22s ease;
    }

    #tai.anTai {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #tai .logoTai {
      width: 100px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;
    }

    #tai .logoTai img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    #tai .vong {
      width: 38px;
      height: 38px;

      border: 3px solid rgba(31,78,121,.16);
      border-top-color: #1F4E79;

      border-radius: 50%;

      animation: quay .8s linear infinite;
    }

    @keyframes quay {
      to {
        transform: rotate(360deg);
      }
    }

    #tai p {
      margin-top: 14px;

      font-size: 13px;
      font-weight: 500;

      color: #7F8C8D;

      text-align: center;
      line-height: 1.5;
    }

    /*
     * Lớp bảo vệ safe-area đáy cho iPhone.
     * Nền đồng nhất với màn đăng nhập.
     */
    body::after {
      content: '';

      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      height: max(env(safe-area-inset-bottom, 0px), 1px);

      background: #EDE0CC;

      pointer-events: none;

      z-index: 0;
    }

    @media (max-width: 600px) {

      #tai .logoTai {
        width: 88px;
        height: 88px;
        margin-bottom: 18px;
      }

      #tai .vong {
        width: 34px;
        height: 34px;
      }

      #tai p {
        font-size: 12.5px;
      }
    }
  </style>
</head>

<body>

  <div id="tai">

    <div class="logoTai">
      <img
        src="https://lh3.googleusercontent.com/d/1IU0gpNl0tcK-9drj2r2FkL2QfykBtjZd"
        alt="HTV EDU Group"
        referrerpolicy="no-referrer"
      >
    </div>

    <div class="vong"></div>

    <p>Đang mở Cổng Thông tin Nhân sự...</p>

  </div>

  <div id="khungApp"></div>

  <script>
    (function () {

      var APP_URL =
        'https://script.google.com/macros/s/AKfycbwT6PZZ1WDmBrAE6g3vfKuQAkbnL7oVuXJfuw2hc-rDLId1L4ONZzfzXduaYDLYZoXI3Q/exec';

      var khung = document.getElementById('khungApp');
      var tai = document.getElementById('tai');

      var app = document.createElement('iframe');

      var daSanSang = false;

      // Giữ màn logo/loading tối thiểu 750ms để tránh cảm giác nháy.
      var BAT_DAU_LOADING = Date.now();
      var THOI_GIAN_LOADING_TOI_THIEU = 750;


      app.id = 'app';

      app.title =
        'Cổng Thông tin Nhân sự HTV';

      app.setAttribute(
        'allow',
        'clipboard-write; geolocation'
      );


      function moApp() {

        if (daSanSang) return;

        daSanSang = true;

        var daCho = Date.now() - BAT_DAU_LOADING;
        var conPhaiCho = Math.max(
          0,
          THOI_GIAN_LOADING_TOI_THIEU - daCho
        );

        setTimeout(function () {

          // Cho iframe hiện trước rồi mới fade loading ra.
          app.classList.add('daTai');

          requestAnimationFrame(function () {

            requestAnimationFrame(function () {

              setTimeout(function () {

                tai.classList.add('anTai');

              }, 120);

            });

          });

        }, conPhaiCho);

      }


      window.addEventListener(
        'message',
        function (event) {

          if (event.source !== app.contentWindow) {
            return;
          }

          if (
            event.data &&
            event.data.type === 'HTV_HRM_READY'
          ) {
            moApp();
          }

        }
      );


      khung.appendChild(app);


      /*
       * Cache-busting để không phục hồi DOM iframe cũ.
       */
      app.src =
        APP_URL
        + '?htv_fresh='
        + Date.now();


      /*
       * Fallback nếu WebView chặn postMessage.
       */
      setTimeout(
        moApp,
        15000
      );

    })();
  </script>

</body>
</html>
