<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTV HR">
  <meta name="theme-color" content="#F6EFE3">

  <title>HTV HR</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://lh3.googleusercontent.com/d/1XXbdoGTqfp6bRR_baYsr0GvQ8uRei4d_"
  >

  <link
    rel="icon"
    type="image/png"
    href="https://lh3.googleusercontent.com/d/1NmEtOM0IPmywMgJoaFKmSWCzNIWRTtJF"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      overscroll-behavior: none;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      font-family:
        'Segoe UI',
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;
    }

    body {
      height: 100vh;
      height: 100svh;
      height: 100dvh;
    }


    /* ==========================================
       KHUNG CHỨA APP
       ========================================== */

    #khungApp {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;

      overflow: hidden;

      background: #F4F6F9;
    }


    /* ==========================================
       IFRAME
       ========================================== */

    #app {
      position: absolute;
      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      border: 0;
      outline: 0;

      background: #F4F6F9;

      opacity: 0;

      transition: opacity .18s ease;
    }

    #app.daTai {
      opacity: 1;
    }


    /* ==========================================
       LOADING
       ========================================== */

    #tai {
      position: fixed;
      inset: 0;

      z-index: 999999;

      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding-top:
        max(20px, env(safe-area-inset-top, 0px));

      padding-right:
        max(20px, env(safe-area-inset-right, 0px));

      padding-bottom:
        max(20px, env(safe-area-inset-bottom, 0px));

      padding-left:
        max(20px, env(safe-area-inset-left, 0px));

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity .22s ease,
        visibility .22s ease;
    }

    #tai.anTai {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* ==========================================
       LOGO LOADING
       ========================================== */

    #tai .logoTai {
      width: 100px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 22px;
    }

    #tai .logoTai img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* ==========================================
       SPINNER
       ========================================== */

    #tai .vong {
      width: 38px;
      height: 38px;

      border: 3px solid rgba(31,78,121,.16);
      border-top-color: #1F4E79;

      border-radius: 50%;

      animation: quay .8s linear infinite;
    }

    @keyframes quay {
      to {
        transform: rotate(360deg);
      }
    }


    #tai p {
      margin-top: 15px;

      font-size: 13px;
      font-weight: 500;

      color: #7F8C8D;

      text-align: center;
      line-height: 1.5;
    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width:600px) {

      #tai .logoTai {
        width: 88px;
        height: 88px;
        margin-bottom: 18px;
      }

      #tai .vong {
        width: 34px;
        height: 34px;
      }

      #tai p {
        font-size: 12.5px;
        margin-top: 13px;
      }
    }
  </style>
</head>


<body>

  <!-- MÀN LOADING -->
  <div id="tai">

    <div class="logoTai">
      <img
        src="https://lh3.googleusercontent.com/d/1IU0gpNl0tcK-9drj2r2FkL2QfykBtjZd"
        alt="HTV EDU Group"
        referrerpolicy="no-referrer"
      >
    </div>

    <div class="vong"></div>

    <p>Đang mở Cổng Thông tin Nhân sự...</p>

  </div>


  <!-- IFRAME SẼ ĐƯỢC JAVASCRIPT TẠO MỚI -->
  <div id="khungApp"></div>


  <script>
    (function () {

      var APP_URL =
        'https://script.google.com/macros/s/AKfycbwT6PZZ1WDmBrAE6g3vfKuQAkbnL7oVuXJfuw2hc-rDLId1L4ONZzfzXduaYDLYZoXI3Q/exec';

      var khung = document.getElementById('khungApp');
      var tai = document.getElementById('tai');

      var app = null;
      var dangNap = false;


      /* ==========================================
         HIỆN LOADING
         ========================================== */

      function hienLoading() {

        tai.classList.remove('anTai');

      }


      /* ==========================================
         ẨN LOADING
         ========================================== */

      function anLoading() {

        requestAnimationFrame(function () {

          requestAnimationFrame(function () {

            setTimeout(function () {

              tai.classList.add('anTai');

            }, 150);

          });

        });

      }


      /* ==========================================
         TẠO APP HOÀN TOÀN MỚI
         ========================================== */

      function napAppMoi() {

        if (dangNap) return;

        dangNap = true;

        hienLoading();


        /*
         * XÓA HẲN iframe cũ.
         *
         * Không tái sử dụng iframe cũ vì Safari,
         * Chrome, PWA và WebView có thể phục hồi
         * nguyên trạng thái DOM/modal trước đó.
         */
        if (app && app.parentNode) {

          try {
            app.src = 'about:blank';
          } catch (e) {}

          app.parentNode.removeChild(app);

          app = null;
        }


        /*
         * Xóa bất kỳ iframe còn sót nào trong container.
         */
        while (khung.firstChild) {
          khung.removeChild(khung.firstChild);
        }


        /*
         * TẠO MỘT iframe HOÀN TOÀN MỚI.
         */
        app = document.createElement('iframe');

        app.id = 'app';

        app.setAttribute(
          'allow',
          'clipboard-write; geolocation'
        );

        app.setAttribute(
          'title',
          'Cổng Thông tin Nhân sự HTV'
        );


        /*
         * Chỉ sau khi iframe MỚI tải xong
         * mới cho người dùng nhìn thấy.
         */
        app.addEventListener(
          'load',
          function () {

            app.classList.add('daTai');

            anLoading();

            dangNap = false;

          },
          { once: true }
        );


        khung.appendChild(app);


        /*
         * Cache-busting.
         *
         * Mỗi lần mở hệ thống là một URL mới,
         * tránh browser/PWA phục hồi iframe cũ.
         */
        app.src =
          APP_URL
          + '?htv_fresh='
          + Date.now();

      }


      /* ==========================================
         LẦN MỞ ĐẦU TIÊN
         ========================================== */

      napAppMoi();


      /* ==========================================
         FIX BACK-FORWARD CACHE
         SAFARI / IPHONE / ANDROID / DESKTOP
         ========================================== */

      window.addEventListener(
        'pageshow',
        function (event) {

          /*
           * Nếu browser phục hồi cả trang GitHub
           * từ bộ nhớ thì iframe bên trong cũng có
           * thể còn nguyên modal cũ.
           *
           * Khi đó bắt buộc tạo iframe mới.
           */
          if (event.persisted) {

            dangNap = false;

            setTimeout(function () {

              napAppMoi();

            }, 0);

          }

        }
      );


      /* ==========================================
         KHI APP QUAY LẠI TỪ BACKGROUND
         ========================================== */

      document.addEventListener(
        'visibilitychange',
        function () {

          /*
           * Không reload mỗi lần chuyển app.
           *
           * Chỉ để browser giữ nguyên phiên đang dùng.
           */
          if (document.visibilityState === 'visible') {
            // Không làm gì.
          }

        }
      );

    })();
  </script>

</body>
</html>
