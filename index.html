<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HTV HR">
<meta name="theme-color" content="#4A1520">
<title>HTV HR</title>
<link rel="apple-touch-icon" sizes="180x180"
      href="https://lh3.googleusercontent.com/d/1XXbdoGTqfp6bRR_baYsr0GvQ8uRei4d_">
<link rel="icon" type="image/png"
      href="https://lh3.googleusercontent.com/d/1NmEtOM0IPmywMgJoaFKmSWCzNIWRTtJF">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#F4F6F9}

  /* Khung hệ thống phủ kín màn hình, kể cả vùng giờ/pin */
  #app{position:fixed;top:0;left:0;width:100%;height:100vh;border:none;display:block}

  /* Ô vô hình dùng để đo vùng giờ/pin và vùng vạch vuốt đáy */
  #doVung{
    position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)
  }

  #tai{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(150deg,#FEFCF8,#F6EFE3,#EDE0CC);
    font-family:'Segoe UI',system-ui,Arial,sans-serif;z-index:10
  }
  #tai img{width:96px;height:96px;object-fit:contain;margin-bottom:18px}
  #tai .vong{
    width:38px;height:38px;border:3px solid rgba(31,78,121,.2);
    border-top-color:#1F4E79;border-radius:50%;animation:quay .9s linear infinite
  }
  @keyframes quay{to{transform:rotate(360deg)}}
  #tai p{margin-top:14px;font-size:13px;color:#7F8C8D}
</style>
</head>
<body>

<div id="tai">
  <img src="https://lh3.googleusercontent.com/d/1IU0gpNl0tcK-9drj2r2FkL2QfykBtjZd" alt="HTV">
  <div class="vong"></div>
  <p>Đang mở Cổng Thông tin Nhân sự...</p>
</div>

<div id="doVung"></div>

<iframe id="app" allow="clipboard-write; geolocation"></iframe>

<script>
(function () {
  var LINK_APP = 'https://script.google.com/macros/s/AKfycbwT6PZZ1WDmBrAE6g3vfKuQAkbnL7oVuXJfuw2hc-rDLId1L4ONZzfzXduaYDLYZoXI3Q/exec';

  var khung = document.getElementById('app');
  var o = document.getElementById('doVung');

  function doVung() {
    var cs = getComputedStyle(o);
    return {
      tren: Math.round(parseFloat(cs.paddingTop) || 0),
      duoi: Math.round(parseFloat(cs.paddingBottom) || 0)
    };
  }

  // iPhone báo chiều cao đã trừ vùng giờ/pin, nên cộng bù lại
  function khopChieuCao() {
    khung.style.height = (window.innerHeight + doVung().tren) + 'px';
  }

  khopChieuCao();
  window.addEventListener('resize', khopChieuCao);
  window.addEventListener('orientationchange', function () {
    setTimeout(khopChieuCao, 300);
  });

  var v = doVung();
  khung.onload = function () {
    document.getElementById('tai').style.display = 'none';
  };
  khung.src = LINK_APP + '?tren=' + v.tren + '&duoi=' + v.duoi;
})();
</script>

</body>
</html>
