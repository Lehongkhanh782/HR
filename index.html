<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HTV HR">
<meta name="theme-color" content="#4A1520">
<link rel="manifest" href="/manifest.json">
<title>HTV HR</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
<link rel="apple-touch-icon" sizes="180x180"
      href="https://lh3.googleusercontent.com/d/1XXbdoGTqfp6bRR_baYsr0GvQ8uRei4d_">
<link rel="icon" type="image/png"
      href="https://lh3.googleusercontent.com/d/1NmEtOM0IPmywMgJoaFKmSWCzNIWRTtJF">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  /* Trang ngoài: không cuộn, nền trùng màu hệ thống */
  html{overflow:hidden;background:#F4F6F9}
  body{background:#F4F6F9}

  /* Khung hệ thống nằm bình thường trong trang (không dùng position:fixed
     để tránh lỗi hở đáy trên iOS 26). Chiều cao do đoạn script bên dưới tính. */
  #app{display:block;width:100%;height:100vh;border:0}

  #tai{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(150deg,#FEFCF8,#F6EFE3,#EDE0CC);
    font-family:'Segoe UI',system-ui,Arial,sans-serif;z-index:10
  }
  #tai img{width:96px;height:96px;object-fit:contain;margin-bottom:18px}
  #tai .vong{
    width:38px;height:38px;border:3px solid rgba(31,78,121,.2);
    border-top-color:#1F4E79;border-radius:50%;animation:quay .9s linear infinite
  }
  @keyframes quay{to{transform:rotate(360deg)}}
  #tai p{margin-top:14px;font-size:13px;color:#7F8C8D}
</style>
</head>
<body>

<div id="tai">
  <img src="https://lh3.googleusercontent.com/d/1IU0gpNl0tcK-9drj2r2FkL2QfykBtjZd" alt="HTV">
  <div class="vong"></div>
  <p>Đang mở Cổng Thông tin Nhân sự...</p>
</div>

<iframe id="app" allow="clipboard-write; geolocation"></iframe>

<script>
(function () {
  var LINK_APP = 'https://script.google.com/macros/s/AKfycbwT6PZZ1WDmBrAE6g3vfKuQAkbnL7oVuXJfuw2hc-rDLId1L4ONZzfzXduaYDLYZoXI3Q/exec';

  /* ===== GHI NHỚ ĐĂNG NHẬP: cất mã phiên của hệ thống trên thiết bị này ===== */
  var KHOA_PHIEN = 'htv_phien_v1';

  /* ===== THÔNG BÁO ĐẨY: xin quyền và lấy token khi được yêu cầu từ bên trong app ===== */
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyBnb2O9FP2uwLrAUKZKmshsSiSODz1uGxw",
      authDomain: "htv-hr-thongbao.firebaseapp.com",
      projectId: "htv-hr-thongbao",
      storageBucket: "htv-hr-thongbao.firebasestorage.app",
      messagingSenderId: "777531029266",
      appId: "1:777531029266:web:928792dc92ac58f4b925cb"
    });
  } catch (x) {}

  function baoKetQuaThongBao(nguoiGui, nguonGui, ketQua, token) {
    try { nguoiGui.postMessage({ type: 'HTV_KET_QUA_THONG_BAO', ketQua: ketQua, token: token || '' }, nguonGui); } catch (x) {}
  }

  function xinQuyenThongBao(nguoiGui, nguonGui) {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) {
      baoKetQuaThongBao(nguoiGui, nguonGui, 'KHONG_HO_TRO');
      return;
    }
    Notification.requestPermission().then(function (quyen) {
      if (quyen !== 'granted') {
        baoKetQuaThongBao(nguoiGui, nguonGui, 'TU_CHOI');
        return;
      }
      navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function (dangKy) {
        var messaging = firebase.messaging();
        messaging.getToken({
          vapidKey: 'BKJOTX1sOOwRmNfCV2OaHZmemZsjosqYBaCOobQZWSnmvhvDOx-HVe3BQSwnNd1W-DBSo0k5_oXslA2klRBRpco',
          serviceWorkerRegistration: dangKy
        }).then(function (token) {
          if (token) baoKetQuaThongBao(nguoiGui, nguonGui, 'THANH_CONG', token);
          else baoKetQuaThongBao(nguoiGui, nguonGui, 'LOI');
        }).catch(function () {
          baoKetQuaThongBao(nguoiGui, nguonGui, 'LOI');
        });
      }).catch(function () {
        baoKetQuaThongBao(nguoiGui, nguonGui, 'LOI');
      });
    });
  }

  // Chỉ trao đổi với nội dung của Google Apps Script (hệ thống nhân sự)
  function nguonHopLe(nguon) {
    return /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(nguon)
        || /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(nguon);
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d.type !== 'string' || !e.source || !nguonHopLe(e.origin)) return;
    try {
      if (d.type === 'HTV_XIN_PHIEN') {
        var token = '';
        try { token = localStorage.getItem(KHOA_PHIEN) || ''; } catch (x) {}
        e.source.postMessage({ type: 'HTV_PHIEN', token: token }, e.origin);
      } else if (d.type === 'HTV_LUU_PHIEN' && d.token) {
        localStorage.setItem(KHOA_PHIEN, String(d.token));
            } else if (d.type === 'HTV_XOA_PHIEN') {
        localStorage.removeItem(KHOA_PHIEN);
      } else if (d.type === 'HTV_XIN_QUYEN_THONG_BAO') {
        xinQuyenThongBao(e.source, e.origin);
      }
    } catch (x) {}
  });

  /* ===== KÍCH THƯỚC KHUNG ===== */
  var khung = document.getElementById('app');
  var laAppIOS = window.navigator.standalone === true;   // iPhone/iPad mở từ màn hình chính
  var daDat = 0;

  /** Chiều cao khung cần dùng, đúng cho mọi dòng máy */
  function chieuCaoCanDung() {
    var w = window.innerWidth, h = window.innerHeight;

    if (laAppIOS && window.screen) {
      var ngang = w > h;
      var a = window.screen.width, b = window.screen.height;
      var rongMH = ngang ? Math.max(a, b) : Math.min(a, b);
      var caoMH  = ngang ? Math.min(a, b) : Math.max(a, b);

      // App chiếm trọn bề ngang màn hình -> dùng chiều cao thật của màn hình.
      // (iPad chia đôi màn hình thì bỏ qua, dùng kích thước cửa sổ.)
      if (Math.abs(rongMH - w) <= 2) return caoMH;
    }
    return h;
  }

  function khopChieuCao() {
    var h = Math.round(chieuCaoCanDung());
    if (h > 0 && h !== daDat) {
      khung.style.height = h + 'px';
      daDat = h;
    }
    // Đưa trang ngoài về đúng vị trí nếu bị đẩy lệch (thường gặp sau khi đóng bàn phím)
    if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
  }

  function khopNhieuLan() {
    khopChieuCao();
    setTimeout(khopChieuCao, 150);
    setTimeout(khopChieuCao, 500);
    setTimeout(khopChieuCao, 1200);
  }

  // Căn lại khi: xoay máy, đổi kích thước, quay lại app, đóng bàn phím
  window.addEventListener('resize', khopChieuCao);
  window.addEventListener('orientationchange', khopNhieuLan);
  window.addEventListener('pageshow', khopNhieuLan);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) khopNhieuLan();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      setTimeout(khopChieuCao, 120);
    });
  }
  window.addEventListener('scroll', function () {
    if (window.scrollY || window.scrollX) setTimeout(khopChieuCao, 120);
  });

  khopNhieuLan();

  khung.onload = function () {
    document.getElementById('tai').style.display = 'none';
    khopNhieuLan();
  };
  khung.src = LINK_APP;
})();
</script>

</body>
</html>
