<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTV HR">
  <meta name="theme-color" content="#EDE0CC">

  <!-- Mở kết nối tới Google sớm, đặc biệt có lợi trên 4G/5G -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://lh3.googleusercontent.com">

  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">
  <link rel="dns-prefetch" href="//lh3.googleusercontent.com">

  <title>HTV HR</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://lh3.googleusercontent.com/d/1XXbdoGTqfp6bRR_baYsr0GvQ8uRei4d_"
  >

  <link
    rel="icon"
    type="image/png"
    href="https://lh3.googleusercontent.com/d/1NmEtOM0IPmywMgJoaFKmSWCzNIWRTtJF"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #EDE0CC;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;

      overflow: hidden;
      overscroll-behavior: none;

      font-family:
        'Segoe UI',
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      -webkit-text-size-adjust: 100%;
    }

    /*
     * Không ép 100dvh trên lớp fixed.
     * inset:0 phủ đúng viewport thực + safe-area iPhone.
     */
    #khungApp,
    #tai {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }

    #khungApp {
      overflow: hidden;
      z-index: 1;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );
    }

    #app {
      position: absolute;
      inset: 0;
      z-index: 1;

      display: block;

      width: 100%;
      height: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      opacity: 0;
      transition: opacity .16s ease;
    }

    #app.daTai {
      opacity: 1;
    }

    #tai {
      z-index: 999999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding-top:
        max(20px, env(safe-area-inset-top, 0px));

      padding-right:
        max(20px, env(safe-area-inset-right, 0px));

      padding-bottom:
        max(20px, env(safe-area-inset-bottom, 0px));

      padding-left:
        max(20px, env(safe-area-inset-left, 0px));

      overflow: hidden;

      background:
        radial-gradient(
          ellipse 60% 45% at 15% 10%,
          rgba(212,165,90,.22),
          transparent 62%
        ),
        radial-gradient(
          ellipse 65% 55% at 88% 92%,
          rgba(122,46,62,.14),
          transparent 65%
        ),
        linear-gradient(
          150deg,
          #FEFCF8 0%,
          #F6EFE3 55%,
          #EDE0CC 100%
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity .18s ease,
        visibility .18s ease;
    }

    #tai.anTai {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #tai .logoTai {
      width: 100px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;
    }

    #tai .logoTai img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #tai .vong {
      width: 38px;
      height: 38px;

      border: 3px solid rgba(31,78,121,.16);
      border-top-color: #1F4E79;
      border-radius: 50%;

      animation: quay .8s linear infinite;
    }

    @keyframes quay {
      to { transform: rotate(360deg); }
    }

    #tai p {
      margin-top: 14px;

      font-size: 13px;
      font-weight: 500;

      color: #7F8C8D;

      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      #tai .logoTai {
        width: 88px;
        height: 88px;
        margin-bottom: 18px;
      }

      #tai .vong {
        width: 34px;
        height: 34px;
      }

      #tai p {
        font-size: 12.5px;
      }
    }
  </style>
</head>

<body>

  <div id="tai">
    <div class="logoTai">
      <img
        src="https://lh3.googleusercontent.com/d/1IU0gpNl0tcK-9drj2r2FkL2QfykBtjZd"
        alt="HTV EDU Group"
        width="100"
        height="100"
        decoding="async"
        fetchpriority="high"
        referrerpolicy="no-referrer"
      >
    </div>

    <div class="vong"></div>

    <p>Đang mở Cổng Thông tin Nhân sự...</p>
  </div>

  <div id="khungApp"></div>

  <script>
    (function () {

      var APP_URL =
        'https://script.google.com/macros/s/AKfycbwT6PZZ1WDmBrAE6g3vfKuQAkbnL7oVuXJfuw2hc-rDLId1L4ONZzfzXduaYDLYZoXI3Q/exec';

      var khung = document.getElementById('khungApp');
      var tai = document.getElementById('tai');

      var app = document.createElement('iframe');

      var daMoApp = false;

      // Đủ để logo không nháy nhưng không tạo cảm giác chờ.
      var BAT_DAU = Date.now();
      var LOADING_TOI_THIEU = 500;


      app.id = 'app';
      app.title = 'Cổng Thông tin Nhân sự HTV';

      app.setAttribute(
        'allow',
        'clipboard-write; geolocation'
      );

      app.setAttribute(
        'loading',
        'eager'
      );


      function moApp() {

        if (daMoApp) return;
        daMoApp = true;

        var daCho = Date.now() - BAT_DAU;
        var conCho = Math.max(
          0,
          LOADING_TOI_THIEU - daCho
        );

        setTimeout(function () {

          app.classList.add('daTai');

          requestAnimationFrame(function () {

            requestAnimationFrame(function () {

              setTimeout(function () {
                tai.classList.add('anTai');
              }, 80);

            });

          });

        }, conCho);
      }


      /*
       * Tín hiệu chính.
       *
       * Apps Script có thể có thêm iframe trung gian của Google,
       * vì vậy KHÔNG khóa event.source === app.contentWindow.
       *
       * Chỉ nhận READY từ domain Google Apps Script /
       * Googleusercontent để tránh message ngoài ý muốn.
       */
      window.addEventListener(
        'message',
        function (event) {

          if (
            !event.data ||
            event.data.type !== 'HTV_HRM_READY'
          ) {
            return;
          }

          var origin = String(event.origin || '');

          var laGoogle =
            origin === 'https://script.google.com' ||
            /^https:\/\/[^/]*googleusercontent\.com$/i.test(origin);

          if (!laGoogle) {
            return;
          }

          moApp();
        }
      );


      /*
       * Fallback 1:
       * nếu browser không chuyển postMessage từ nested iframe,
       * onload của iframe vẫn mở được app.
       */
      app.addEventListener(
        'load',
        function () {
          setTimeout(moApp, 80);
        },
        { once: true }
      );


      /*
       * Không gắn timestamp vào URL.
       * Giữ URL ổn định để điện thoại tận dụng DNS/TLS/cache.
       */
      app.src = APP_URL;

      khung.appendChild(app);


      /*
       * Fallback cuối cùng.
       * Bình thường READY/onload sẽ chạy trước rất lâu.
       */
      setTimeout(
        moApp,
        6000
      );

    })();
  </script>

</body>
</html>
